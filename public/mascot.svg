  <rect x="60" y="148" width="46" height="32" rx="10" fill="#0b1020" stroke="url(#rim)" stroke-width="2"/>
  <path d="M75,180 L85,180 L78,190 Z" fill="#0b1020" stroke="url(#rim)" stroke-width="2"/>
  <circle cx="72" cy="164" r="3" fill="#67e8f9"/>
