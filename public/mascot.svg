  <rect x="20" y="105" width="26" height="55" rx="13" fill="url(#orbFill)" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="33" cy="132" r="6" fill="url(#rim)"/>
  <rect x="194" y="105" width="26" height="55" rx="13" fill="url(#orbFill)" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="207" cy="132" r="6" fill="url(#rim)"/>

  <circle cx="120" cy="130" r="78" fill="url(#orbFill)" stroke="url(#rim)" stroke-width="4"/>
